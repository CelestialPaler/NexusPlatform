name: Validate

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_profile: macos-demo
            feature_profile: demo
          - os: macos-latest
            build_profile: macos-demo
            feature_profile: demo
          - os: windows-latest
            build_profile: windows-debug
            feature_profile: full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nexus-platform/frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./nexus-contracts
          pip install -e ./nexus-core
          pip install -r ./nexus-platform/requirements.txt

      - name: Install frontend dependencies
        working-directory: nexus-platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: nexus-platform/frontend
        run: npm run build

      - name: Compile Python sources
        run: |
          python -m compileall build-system nexus-contracts/src nexus-core nexus-platform/backend nexus-platform/run.py

      - name: Validate profile-driven build plan
        run: python build-system/build.py --build-profile "${{ matrix.build_profile }}" --feature-profile "${{ matrix.feature_profile }}" --validate-readonly